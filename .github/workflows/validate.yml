name: Validate generated StarLang wire contract
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: cachix/install-nix-action@v31
      - name: Verify immutable upstream release
        run: python3 scripts/sync-starintel-schema.py
      - name: Build and test the real ZeroMQ broker
        run: nix flake check -L
