name: Payload preservation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.4'
      - run: nim c -r tests/test_payload.nim
      - run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - run: nimble install -y --depsOnly
      - run: nim check --path:src tests/test_client_contract.nim
      - run: nim c -r --path:src tests/test_client_contract.nim
      - run: nim c -r --path:src tests/test_dispatch_contract.nim
